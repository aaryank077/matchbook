name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GoogleTest
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libgtest-dev
          else brew install googletest; fi
      - name: Build (-Wall -Wextra -Werror)
        run: make all
      - name: Unit tests (sanitizers)
        run: make test
      - name: ITCH decoder tests (sanitizers)
        run: make itch-test
      - name: Rebuild real NASDAQ books vs. Python reference (sanitizers)
        run: make itch-replay-test
      - name: Differential fuzzing vs. Python reference model
        run: make fuzz
      - name: Benchmark smoke run
        run: ./build/bench -n 500000
